name: Intraday 30min Analysis
on:
  schedule:
    - cron: '0 4 * * *'
    - cron: '30 4 * * *'
    - cron: '0 5 * * *'
    - cron: '30 5 * * *'
    - cron: '0 6 * * *'
    - cron: '30 6 * * *'
    - cron: '0 7 * * *'
    - cron: '30 7 * * *'
    - cron: '0 8 * * *'
    - cron: '30 8 * * *'
    - cron: '0 9 * * *'
    - cron: '30 9 * * *'
    - cron: '0 10 * * *'
    - cron: '30 10 * * *'
    - cron: '0 11 * * *'
    - cron: '30 11 * * *'
    - cron: '0 12 * * *'
    - cron: '30 12 * * *'
    - cron: '0 13 * * *'
    - cron: '30 13 * * *'
    - cron: '0 14 * * *'
    - cron: '30 14 * * *'
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: '1'
      REQUIRE_TELEGRAM: '1'
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify scanner regression tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest -q test_quote_metadata.py test_notion_archive.py
      - name: Run stock analysis
        run: python tracked_scanner.py intraday
      - name: Archive confirmed per-symbol price observations
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs');
            if(fs.existsSync('delivered_observations')) {
              for(const file of fs.readdirSync('delivered_observations').filter(f=>f.endsWith('.json'))) {
                const observation=JSON.parse(fs.readFileSync('delivered_observations/'+file,'utf8'));
                await require('./archive_observation.cjs').appendObservation({github,repo:context.repo,observation,core});
              }
            }
      - name: Save analysis results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intraday-bot-results
          path: |
            delivered_observations/*.json
            actions_reports/*.json
            intraday_reports/*.json
          retention-days: 7
          if-no-files-found: warn
