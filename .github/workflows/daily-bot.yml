name: Hourly Stock Analysis
on:
  workflow_dispatch:
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
      TARGET_CHAT_ID: ${{ secrets.NEWCODE_TELEGRAM_CHAT_ID }}
    steps:
      - name: Verify private Telegram destination
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen
          
          token = os.environ['BOT_TOKEN'].strip()
          chat_id = os.environ['TARGET_CHAT_ID'].strip()
          if not token or not re.fullmatch(r'-[0-9]+', chat_id):
              raise SystemExit('Missing bot token or private group ID')
          
          def call(method, **params):
              request = Request(f'https://api.telegram.org/bot{token}/{method}',
                                data=json.dumps(params).encode(),
                                headers={'Content-Type': 'application/json'})
              try:
                  with urlopen(request, timeout=15) as response:
                      result = json.load(response)
              except HTTPError as error:
                  raise SystemExit(f'Telegram {method} failed (HTTP {error.code})') from None
              except (URLError, ValueError, TimeoutError):
                  raise SystemExit(f'Telegram {method} failed') from None
              if not result.get('ok'):
                  raise SystemExit(f'Telegram {method} was rejected')
              return result['result']
          
          bot = call('getMe')
          print(f"Bot username: @{bot['username']}")
          chat = call('getChat', chat_id=int(chat_id))
          if chat.get('title') != '반도체 알림 · 신규코드' or chat.get('type') not in ('group', 'supergroup') or chat.get('username'):
              raise SystemExit('Unexpected destination or group visibility')
          member = call('getChatMember', chat_id=int(chat_id), user_id=bot['id'])
          status = member.get('status')
          if status not in ('member', 'administrator', 'creator'):
              raise SystemExit('Bot is not a member of the destination')
          if status == 'member' and not chat.get('permissions', {}).get('can_send_messages'):
              raise SystemExit('Bot cannot post to the destination')
          print('Verified: 반도체 알림 · 신규코드')
          PY
