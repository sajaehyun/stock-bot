name: Daily Stock Analysis

on:
  schedule:
    - cron: '0 0 * * *' # 매일 00:00 UTC (한국 시간 기준 오전 9시) 자동 실행
  workflow_dispatch: # 수동 실행을 위한 옵션

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: '1'
      REQUIRE_TELEGRAM: '1'
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify scanner regression tests
        run: python -m unittest discover -s tests -v
      - name: Run stock analysis
        run: python bot.py
      - name: Save analysis results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyze-results
          path: |
            history/*.json
            intraday_reports/*.json
          retention-days: 7
          if-no-files-found: warn
