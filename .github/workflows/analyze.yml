name: Daily Stock Analysis

on:
  schedule:
    - cron: '0 0 * * *' # 매일 00:00 UTC (한국 시간 기준 오전 9시) 자동 실행
  workflow_dispatch: # 수동 실행을 위한 옵션

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: '1'
      REQUIRE_TELEGRAM: '1'
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify scanner regression tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest -q test_quote_metadata.py test_notion_archive.py test_split_storage.py
      - name: Run stock analysis
        run: python tracked_scanner.py daily
      - name: Archive confirmed per-symbol price observations
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs');
            if(fs.existsSync('delivered_observations')) {
              for(const file of fs.readdirSync('delivered_observations').filter(f=>f.endsWith('.json'))) {
                const observation=JSON.parse(fs.readFileSync('delivered_observations/'+file,'utf8'));
                await require('./archive_observation.cjs').appendObservation({github,repo:context.repo,observation,core});
              }
            }
      - name: Save analysis results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyze-results
          path: |
            delivered_observations/*.json
            actions_reports/*.json
            intraday_reports/*.json
          retention-days: 7
          if-no-files-found: warn
